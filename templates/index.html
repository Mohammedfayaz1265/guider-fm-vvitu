<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FM Guider - Home</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0d0618, #4a0080);
            color: white;
            text-align: center;
            padding: 60px 20px;
            min-height: 100vh;
        }
        h1 { font-size: 3rem; margin-bottom: 20px; }
        .btn {
            padding: 15px 30px;
            margin: 15px;
            font-size: 1.1rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
        }
        .btn-chat { background: linear-gradient(90deg, #ec4899, #7c3aed); color: white; }
        .btn-logout { background: #666; color: white; }
    </style>
</head>
<body>
    <h1>Welcome, {{ user_name }} 👋</h1>
    <p style="font-size: 1.3rem; margin: 20px 0;">Ready to explore VVITU?</p>
    
    <a href="/chat"><button class="btn btn-chat">🚀 Start Chat with FM Guider</button></a>
    <a href="/logout"><button class="btn btn-logout">Logout</button></a>
</body>
</html>
