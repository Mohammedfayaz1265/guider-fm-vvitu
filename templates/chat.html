<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat with FM Guider</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body style="background:var(--dark);">
    <div class="chat-container">
        <!-- HEADER -->
        <div class="chat-header">
            <a href="/home" class="back-btn">&#8592;</a>
            <div style="font-size:2rem; animation: float 3s ease infinite;">🎓</div>
            <div>
                <h3 class="syne-font" style="margin:0;">FM Guider</h3>
                <p style="margin:0; font-size:0.8rem; color:var(--muted);">AI Companion by Fayaz & Masthan</p>
            </div>
            <div class="online-dot"></div>
        </div>
        <!-- PILLS -->
        <div class="pills-wrap">
            <div class="pills-content" id="pillsContainer">
                <button class="pill" onclick="sendPill('What are the college timings?')">⏰ Timings</button>
                <button class="pill" onclick="sendPill('Tell me about Hostel facilities')">🏠 Hostel</button>
                <button class="pill" onclick="sendPill('What are the fees?')">💰 Fees</button>
                <button class="pill" onclick="sendPill('What departments do you have?')">🏫 Departments</button>
                <button class="pill" onclick="sendPill('Tell me about Placements and Packages')">💼 Packages</button>
                <button class="pill" onclick="sendPill('What are the extracurricular activities?')">🎉
                    Activities</button>
                <button class="pill" onclick="sendPill('How to get admission?')">📝 Admission</button>
                <button class="pill" onclick="sendPill('Library timings and books?')">📚 Library</button>
                <button class="pill" onclick="sendPill('Transport and Bus facilities?')">🚌 Transport</button>
                <button class="pill" onclick="sendPill('Scholarship details?')">🎓 Scholarships</button>
                <!-- Duplicated for seamless scroll -->
                <button class="pill" onclick="sendPill('What are the college timings?')">⏰ Timings</button>
                <button class="pill" onclick="sendPill('Tell me about Hostel facilities')">🏠 Hostel</button>
                <button class="pill" onclick="sendPill('What are the fees?')">💰 Fees</button>
                <button class="pill" onclick="sendPill('What departments do you have?')">🏫 Departments</button>
                <button class="pill" onclick="sendPill('Tell me about Placements and Packages')">💼 Packages</button>
            </div>
        </div>
        <!-- MESSAGES AREA -->
        <div class="chat-area" id="chatArea">
            <div class="msg msg-bot">
                <strong>Hello! 👋</strong><br>
                I'm FM Guider, your AI companion for VVITU. How can I assist you today? 😊
            </div>

            <div class="typing" id="typingIndicator">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        </div>
        <!-- INPUT BAR -->
        <div class="chat-input-bar">
            <input type="text" id="userInput" class="chat-input" placeholder="Type your message here..."
                onkeypress="handleEnter(event)">
            <button class="btn-send" onclick="sendMessage()">&#10148;</button>
        </div>
    </div>
    <script>
        // ============================================================
        //  🔗 PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL BELOW
        //  Deploy code.gs → Deploy as Web App → Copy URL → Paste here
        // ============================================================
        const GAS_WEB_URL = "https://script.google.com/macros/s/AKfycbwKgENUHuNE0xwEu0UhjzB-c45y_pqWSWwwVAqI1caLDR-zIK5vSiDA4OV9lsU9msBX/exec";

        const chatArea = document.getElementById('chatArea');
        const userInput = document.getElementById('userInput');
        const typingIndicator = document.getElementById('typingIndicator');

        function scrollToBottom() {
            chatArea.scrollTop = chatArea.scrollHeight;
        }
        function handleEnter(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }
        function sendPill(text) {
            document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
            if (event && event.target) {
                event.target.classList.add('active');
            }
            userInput.value = text;
            sendMessage();
        }

        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;

            // Add user message bubble
            appendMessage(message, 'user');
            userInput.value = '';

            // Show typing indicator
            typingIndicator.style.display = 'flex';
            chatArea.appendChild(typingIndicator);
            scrollToBottom();

            try {
                const response = await fetch(GAS_WEB_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ message }),
                    redirect: 'follow'
                });

                const data = await response.json();

                // Hide typing
                typingIndicator.style.display = 'none';

                if (data.error) {
                    appendMessage("Error: " + data.error, 'bot');
                } else {
                    // Render markdown → HTML
                    let htmlResponse = marked.parse(data.response);
                    appendHTMLMessage(htmlResponse, 'bot');
                }
            } catch (err) {
                typingIndicator.style.display = 'none';
                appendMessage("Sorry, I'm having trouble connecting. Please check the GAS Web URL.", 'bot');
                console.error("Fetch error:", err);
            }
            scrollToBottom();
        }

        function appendMessage(text, sender) {
            const div = document.createElement('div');
            div.className = `msg msg-${sender}`;
            div.innerText = text;
            chatArea.insertBefore(div, typingIndicator);
            scrollToBottom();
        }

        function appendHTMLMessage(html, sender) {
            const div = document.createElement('div');
            div.className = `msg msg-${sender}`;
            div.innerHTML = html;
            chatArea.insertBefore(div, typingIndicator);
            scrollToBottom();
        }
    </script>
</body>

</html>
